<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kurosuzu Épisode 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;900&display=swap" rel="stylesheet">
<style>
/* Concept: webtoon vertical en colonne, scènes épinglées pilotées par le scroll, encre noire + aplat rouge, chaleur ambre pour Suzu */
:root{
  --ink:#0a090d; --ink2:#15131c; --paper:#efe8da; --red:#d7141f; --red2:#7d0a12;
  --gold:#f0c43a; --moon:#9db8d8; --ember:#ff9a3c; --dawn:#ffcf8a;
  --f-title:'Shippori Mincho B1','Noto Serif JP',serif;
  --f-ui:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;
  --f-sfx:'Dela Gothic One','Noto Sans JP',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-ui);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#reader{max-width:520px;margin:0 auto;position:relative;background:var(--ink);box-shadow:0 0 0 1px #1d1b26,0 0 90px #000}
svg{display:block}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;z-index:60;pointer-events:none}
.hud-in{max-width:520px;margin:0 auto;position:relative}
.bar{height:3px;background:var(--red);width:100%;transform:scaleX(0);transform-origin:0 50%}
.hud-btns{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;gap:8px;pointer-events:auto}
.hbtn{appearance:none;border:1.5px solid rgba(239,232,218,.55);background:rgba(10,9,13,.55);color:var(--paper);font:700 12px/1 var(--f-ui);letter-spacing:.08em;padding:9px 11px;border-radius:99px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer}
.hbtn:focus-visible,.tap:focus-visible,.enter:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.menu{position:fixed;inset:0;z-index:70;background:rgba(5,4,8,.94);display:none;place-items:center}
.menu.open{display:grid}
.menu ul{list-style:none;margin:0;padding:0 max(24px,env(safe-area-inset-left,0px));display:grid;gap:18px;text-align:center}
.menu a{color:var(--paper);text-decoration:none;font-family:var(--f-title);font-weight:800;font-size:clamp(22px,6vw,30px)}
.menu small{display:block;font:500 12px var(--f-ui);letter-spacing:.2em;color:var(--red);margin-bottom:4px}

/* Scènes épinglées */
.stage{position:relative}
.pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.layer{position:absolute;inset:-16% -4%;will-change:transform,opacity;transform-origin:50% 50%}
.layer>svg{width:100%;height:100%}
.layer.fill{inset:0}
.ash{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.vig{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(0,0,0,.65))}
.redpulse{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(215,20,31,.85))}
.flash{position:absolute;inset:0;pointer-events:none;z-index:6;background:#fff;opacity:0}

/* Bulles */
.b{position:absolute;z-index:7;opacity:0;pointer-events:none;
  --tx:0px;--ty:0px;transform:translate(var(--tx),calc(var(--ty) + 14px)) scale(.96);
  transition:opacity .45s ease,transform .5s cubic-bezier(.2,1.2,.4,1)}
.b.on{opacity:1;transform:translate(var(--tx),var(--ty))}
.b.c{--tx:-50%}
.say{width:max-content;max-width:62%;background:var(--paper);color:var(--ink);font-weight:900;border-radius:50%/48%;
  padding:.75em 1.15em;text-align:center;line-height:1.28;font-size:clamp(14px,4.1vw,19px);box-shadow:0 0 0 3px var(--ink),0 6px 18px rgba(0,0,0,.45)}
.say::after{content:"";position:absolute;width:20px;height:22px;background:var(--paper);bottom:-17px;left:22%;clip-path:polygon(0 0,100% 0,25% 100%)}
.say[data-t="br"]::after{left:auto;right:22%;clip-path:polygon(0 0,100% 0,75% 100%)}
.say[data-t="tl"]::after{bottom:auto;top:-17px;left:22%;clip-path:polygon(25% 0,100% 100%,0 100%)}
.say[data-t="tr"]::after{bottom:auto;top:-17px;left:auto;right:22%;clip-path:polygon(75% 0,100% 100%,0 100%)}
.say[data-t="n"]::after{display:none}
.say.soft{background:#dfe6f2;font-weight:500;font-style:italic;color:#2a3350}
.say.soft::after{background:#dfe6f2}
.say.warm{background:#fff5e6;box-shadow:0 0 0 3px #3a1d12,0 6px 18px rgba(80,30,0,.3)}
.say.warm::after{background:#fff5e6}
.say.small{font-size:clamp(12px,3.4vw,16px);font-weight:500}
.nar{width:max-content;max-width:74%;background:var(--ink);color:var(--paper);border:1.5px solid rgba(239,232,218,.85);
  font-family:var(--f-title);font-weight:500;font-size:clamp(13px,3.8vw,17px);line-height:1.5;padding:.7em 1em;box-shadow:5px 5px 0 var(--red)}
.nar.plain{background:transparent;border:0;box-shadow:none;text-shadow:0 2px 12px #000,0 0 3px #000}
.nar.warm{background:#2a140c;border-color:#ffd9a0;color:#ffe9cc;box-shadow:5px 5px 0 #c4561c}
.oni{width:max-content;max-width:70%;background:radial-gradient(#150306 50%,#7a0a14);color:#ff3b45;font-family:var(--f-title);font-weight:800;
  font-size:clamp(15px,4.4vw,21px);line-height:1.3;padding:1.1em 1.5em;text-align:center;letter-spacing:.02em;
  clip-path:polygon(0 14%,7% 0,15% 10%,26% 0,36% 9%,48% 0,60% 10%,72% 0,83% 9%,94% 0,100% 16%,93% 32%,100% 48%,94% 64%,100% 80%,90% 100%,78% 91%,66% 100%,52% 91%,40% 100%,28% 91%,16% 100%,6% 88%,0 72%,7% 56%,0 38%,7% 24%)}
.sfx{font-family:var(--f-sfx);color:var(--paper);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 5px 0 var(--red);
  font-size:clamp(46px,18vw,104px);line-height:.95;--rot:-8deg;white-space:nowrap;
  transform:translate(var(--tx),0) rotate(var(--rot)) scale(.5);transition:opacity .2s,transform .35s cubic-bezier(.2,1.8,.4,1)}
.sfx.on{transform:translate(var(--tx),0) rotate(var(--rot)) scale(1)}
.sfx small{display:block;font:900 12px var(--f-ui);letter-spacing:.35em;text-align:center;-webkit-text-stroke:0;text-shadow:none;color:var(--gold);margin-top:6px}
.sfx.red{color:var(--red);text-shadow:4px 5px 0 #000;-webkit-text-stroke:2px #000}
.sfx.ink{color:var(--ink);-webkit-text-stroke:0;text-shadow:3px 3px 0 var(--paper)}
.cap{position:absolute;z-index:7;left:0;right:0;text-align:center;font:500 12px var(--f-ui);letter-spacing:.3em;color:rgba(239,232,218,.75);text-transform:uppercase}

/* Panels */
.panel{position:relative;overflow:hidden;width:100%}
.panel>svg{position:absolute;inset:0;width:100%;height:100%}
.gap{background:var(--ink)}
.band{position:relative;width:100%}

/* Vides */
.void{padding:22vh 9vw 18vh;text-align:center;background:var(--ink)}
.vl{font-family:var(--f-title);font-weight:500;font-size:clamp(20px,6vw,30px);line-height:1.55;margin:0 0 46vh;opacity:0;transform:translateY(22px);transition:opacity 1.1s ease,transform 1.1s ease}
.vl.in{opacity:1;transform:none}
.vl.r{color:var(--red);font-weight:800}
.vl:last-child{margin-bottom:0}

/* Cartes d'épisode */
.card{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:grid;place-items:center;text-align:center;background:var(--red);color:var(--ink)}
.card .cc{position:absolute;inset:0}
.card .ct{position:relative;z-index:2;padding:0 max(22px,env(safe-area-inset-left,0px));opacity:0;transform:translateY(24px);transition:all 1s ease}
.card.in .ct{opacity:1;transform:none}
.card .ep{font:900 13px var(--f-ui);letter-spacing:.5em;color:var(--paper)}
.card .kj{font-family:var(--f-title);font-weight:800;font-size:min(52vw,260px);line-height:1;color:var(--ink);margin:.1em 0 .05em;text-shadow:6px 6px 0 rgba(239,232,218,.9)}
.card h2{font-family:var(--f-title);font-weight:800;font-size:clamp(24px,7.2vw,36px);margin:0;color:var(--paper);text-shadow:3px 3px 0 var(--ink);text-wrap:balance}
.card p{font:500 14px/1.6 var(--f-ui);color:var(--paper);margin:14px auto 0;max-width:30ch;text-shadow:0 1px 8px #000}
.end{background:var(--ink)}
.end .kj{color:var(--red);text-shadow:none;font-size:min(26vw,130px)}
.end h2{color:var(--paper);text-shadow:none}
.end .ct{opacity:1;transform:none}

/* Couverture */
.titlebox{position:absolute;z-index:8;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12svh;pointer-events:none;will-change:transform,opacity}
.kanji{font-family:var(--f-title);font-weight:800;writing-mode:vertical-rl;font-size:min(30vw,150px);line-height:1.05;letter-spacing:.04em;color:var(--paper);text-shadow:5px 5px 0 var(--ink);margin:0}
.latin{font-family:var(--f-title);font-weight:800;font-size:clamp(34px,11.5vw,64px);letter-spacing:.22em;margin:.4em 0 0 .22em;color:var(--paper);text-shadow:4px 4px 0 var(--ink)}
.tome{margin-top:14px;font:900 11px var(--f-ui);letter-spacing:.3em;white-space:nowrap;color:var(--ink);background:var(--paper);padding:.55em 1em .5em 1.2em}
.hint{position:absolute;z-index:8;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom,0px));text-align:center;font:900 11px var(--f-ui);letter-spacing:.45em;color:var(--paper);animation:bob 1.8s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(8px);opacity:.55}}
.enter{position:absolute;z-index:9;left:50%;bottom:calc(max(26px,env(safe-area-inset-bottom,0px)) + 44px);transform:translateX(-50%);appearance:none;border:2px solid var(--paper);background:rgba(10,9,13,.6);color:var(--paper);font:900 12px var(--f-ui);letter-spacing:.2em;padding:12px 18px;border-radius:99px;cursor:pointer;white-space:nowrap}

/* Interactions */
.tap{position:absolute;z-index:9;left:50%;bottom:calc(max(22px,env(safe-area-inset-bottom,0px)) + 10px);transform:translateX(-50%);width:104px;height:104px;border-radius:50%;
  appearance:none;border:0;cursor:pointer;color:var(--paper);font:900 12px/1.15 var(--f-ui);letter-spacing:.14em;text-align:center;touch-action:manipulation;
  background:radial-gradient(circle,#1a0407 58%,transparent 59%),conic-gradient(var(--red) calc(var(--v,0)*360deg),rgba(239,232,218,.28) 0);
  opacity:0;pointer-events:none;transition:opacity .4s}
.tap.on{opacity:1;pointer-events:auto}
.tap span{display:block;padding-top:35px}
.tap:active{transform:translateX(-50%) scale(.94)}
.hintline{position:absolute;z-index:8;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px) + 34px);text-align:center;font:900 11px var(--f-ui);letter-spacing:.3em;color:var(--gold);text-shadow:0 1px 8px #000;opacity:0;transition:opacity .5s}
.hintline.on{opacity:1}
.eyepair{position:absolute;width:44px;height:14px;transform:translate(-50%,-50%) scale(var(--sc,1))}
.eyepair i{position:absolute;top:0;width:15px;height:9px;border-radius:50% 50% 50% 50%/70% 70% 40% 40%;background:var(--gold);box-shadow:0 0 12px 3px rgba(240,196,58,.7)}
.eyepair i:first-child{left:0}.eyepair i:last-child{right:0}
.eyepair i::after{content:"";position:absolute;left:46%;top:0;width:2.5px;height:100%;background:#120a00}
.seen .eyepair i,.eyepair.seen i{background:var(--red);box-shadow:0 0 14px 4px rgba(215,20,31,.8)}
.ringfx{position:absolute;z-index:6;width:40px;height:40px;border:3px solid var(--gold);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(.2);opacity:.9}
.ringfx.go{animation:ring 1.2s ease-out forwards}
@keyframes ring{to{transform:translate(-50%,-50%) scale(9);opacity:0}}
.bellbtn{position:absolute;z-index:9;appearance:none;border:0;background:none;width:96px;height:96px;cursor:pointer;transform:translate(-50%,-50%);touch-action:manipulation}
.bellbtn::before{content:"";position:absolute;inset:18px;border-radius:50%;border:2px dashed rgba(240,196,58,.9);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.credits{padding:12vh 8vw;text-align:center;font:500 13px/1.8 var(--f-ui);color:rgba(239,232,218,.65);background:var(--ink)}

@media (prefers-reduced-motion:reduce){
  .b,.vl,.sfx,.card .ct{transition:none}.hint{animation:none}.bellbtn::before{animation:none}
}
</style>
<style>
.ibox{position:absolute;left:50%;top:50%;height:100%;transform:translate(-50%,-50%)}
.ibox img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.ibox .ov{position:absolute;inset:0;pointer-events:none}
.panel>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.dis{position:absolute;inset:0;--m:0;-webkit-mask-image:linear-gradient(to bottom,transparent calc(var(--m)*45%),#000 calc(var(--m)*45% + 22%));mask-image:linear-gradient(to bottom,transparent calc(var(--m)*45%),#000 calc(var(--m)*45% + 22%))}
.warmvoid{background:#2a140c;color:#ffe9cc}
.warmvoid .vl{color:#ffe9cc}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<radialGradient id="gGold"><stop offset="0" stop-color="#f0c43a" stop-opacity=".75"/><stop offset="1" stop-color="#f0c43a" stop-opacity="0"/></radialGradient>
</defs></svg>
<div class="hud"><div class="hud-in"><div class="bar"></div><div class="hud-btns"><button class="hbtn" id="snd" type="button">SON ✕</button><button class="hbtn" id="mbtn" type="button">ÉPISODES</button></div></div></div>
<nav class="menu" aria-label="Épisodes"><ul>

<script>
'use strict';
/* ====== ART : encre procédurale ====== */
const PAL={ink:'#0a090d',paper:'#efe8da',red:'#d7141f',red2:'#7d0a12',gold:'#f0c43a'};
const rad=d=>d*Math.PI/180, f1=n=>Math.round(n*10)/10;
let UID=0;
function R(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const svg=(inner,vb='0 0 400 800',par='xMidYMid slice')=>`<svg viewBox="${vb}" preserveAspectRatio="${par}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

/* Hachures verticales façon encre qui coule */
function comb(x,y,w,h,o={}){const{gap=3.4,col=PAL.paper,lw=1.2,seed=1,min=.25,up=false,op=1}=o;const r=R(seed);let d='';
  for(let x0=x;x0<x+w;x0+=gap*(.7+r()*.6)){const l=Math.min(h,h*(min+(1-min)*r()*r()*1.25));d+=up?`M${f1(x0)} ${f1(y+h)}v${f1(-l)}`:`M${f1(x0)} ${f1(y)}v${f1(l)}`}
  return `<path d="${d}" stroke="${col}" stroke-width="${lw}" fill="none" opacity="${op}"/>`}
/* Lignes de vitesse convergentes */
function speed(cx,cy,n,r1,r2,col,seed){const r=R(seed);let d='';
  for(let i=0;i<n;i++){const a=r()*6.283,w=.01+r()*.028,a1=r1*(.8+r()*.4),a2=r2*(.9+r()*.25);
    d+=`M${f1(cx+Math.cos(a)*a1)} ${f1(cy+Math.sin(a)*a1)}L${f1(cx+Math.cos(a-w)*a2)} ${f1(cy+Math.sin(a-w)*a2)}L${f1(cx+Math.cos(a+w)*a2)} ${f1(cy+Math.sin(a+w)*a2)}Z`}
  return `<path d="${d}" fill="${col}"/>`}
function ridge(seed,y,amp,col,n=10){const r=R(seed);let d=`M-10 820L-10 ${y}`;for(let i=0;i<=n;i++){d+=`L${f1(i/n*420-10)} ${f1(y-r()*amp)}`}return `<path d="${d}L410 820Z" fill="${col}"/>`}
function moon(cx,cy,r,col='#dfe9f5'){return `<circle cx="${cx}" cy="${cy}" r="${r*2.8}" fill="url(#gMoon)"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}"/><g fill="#b4c4dc" opacity=".6"><circle cx="${cx-r*.3}" cy="${cy-r*.2}" r="${r*.18}"/><circle cx="${cx+r*.25}" cy="${cy+r*.3}" r="${r*.12}"/><circle cx="${cx+r*.1}" cy="${cy-r*.5}" r="${r*.08}"/></g>`}
function stars(seed,n,h=380){const r=R(seed);let s='';for(let i=0;i<n;i++)s+=`<circle cx="${f1(r()*400)}" cy="${f1(r()*h)}" r="${f1(.5+r()*1.1)}" fill="#cfe0f5" opacity="${f1(.3+r()*.6)}"/>`;return s}
function skyRect(id='gSkyN'){return `<rect width="400" height="800" fill="url(#${id})"/>`}
function fog(y,h,id='gFog'){return `<rect x="-10" y="${y}" width="420" height="${h}" fill="url(#${id})"/>`}

function bamboo(seed,n,o={}){const{col='#0b0e1a',rim='#3b4a6e',y0=-30,y1=840,wmin=6,wmax=15,leaf=true}=o;const r=R(seed);let s='';
  for(let i=0;i<n;i++){const x=(i+.5)/n*420-10+(r()-.5)*36,w=wmin+r()*(wmax-wmin),lean=(r()-.5)*28,xt=x+lean;
    s+=`<path d="M${f1(x)} ${y1}L${f1(xt)} ${y0}" stroke="${rim}" stroke-width="${f1(w+2)}" transform="translate(-1.6 0)"/><path d="M${f1(x)} ${y1}L${f1(xt)} ${y0}" stroke="${col}" stroke-width="${f1(w)}"/>`;
    for(let yy=y1-60-r()*40;yy>y0;yy-=70+r()*50){const t=(y1-yy)/(y1-y0),xx=x+lean*t;s+=`<path d="M${f1(xx-w/2-1)} ${f1(yy)}h${f1(w+2)}" stroke="${rim}" stroke-width="1.6" opacity=".75"/>`}
    if(leaf)for(let k=0;k<4;k++){const t=.5+r()*.45,yy=y1-(y1-y0)*t,xx=x+lean*t,dir=r()<.5?-1:1,L=26+r()*30;
      s+=`<path d="M${f1(xx)} ${f1(yy)}q${f1(dir*L*.6)} ${f1(-L*.1)} ${f1(dir*L)} ${f1(L*.5)}q${f1(-dir*L*.4)} ${f1(-L*.35)} ${f1(-dir*L)} ${f1(-L*.5)}z" fill="${col}" stroke="none"/>`}}
  return `<g fill="none" stroke-linecap="butt">${s}</g>`}

function torii(x,y,s=1,col='#c4121c',dark='#3c0508'){return `<g transform="translate(${x} ${y}) scale(${s})">
 <rect x="-48" y="-112" width="11" height="112" fill="${col}"/><rect x="37" y="-112" width="11" height="112" fill="${col}"/>
 <rect x="-37" y="-112" width="3" height="112" fill="${dark}"/><rect x="45" y="-112" width="3" height="112" fill="${dark}"/>
 <rect x="-58" y="-94" width="116" height="8" fill="${col}"/><rect x="-58" y="-86" width="116" height="3" fill="${dark}"/>
 <path d="M-78 -128 Q0 -112 78 -128 L82 -138 Q0 -122 -82 -138Z" fill="#0a090d"/>
 <path d="M-70 -118 Q0 -104 70 -118 L72 -128 Q0 -112 -72 -128Z" fill="${col}"/>
 <rect x="-5" y="-118" width="10" height="26" fill="${dark}"/></g>`}
function ishi(x,y,s=1,lit=0,col='#262634',rim='#5a6a8f'){return `<g transform="translate(${x} ${y}) scale(${s})">
 <rect x="-9" y="-30" width="18" height="30" fill="${col}"/><rect x="-13" y="-4" width="26" height="4" fill="${col}"/>
 <rect x="-15" y="-52" width="30" height="22" fill="${col}"/><rect x="-9" y="-48" width="18" height="14" class="lamp" fill="${PAL.gold}" opacity="${lit}"/>
 <path d="M-24 -52 L0 -72 L24 -52Z" fill="${col}"/><path d="M-24 -52 L0 -72" stroke="${rim}" stroke-width="1.6"/><circle cx="0" cy="-75" r="3" fill="${col}"/></g>`}
function house(x,y,s=1,o={}){const{lit=1,wall='#241d2e',roof='#120f19',glow='#ffb347',rim='#6a7aa0'}=o;return `<g transform="translate(${x} ${y}) scale(${s})">
 <path d="M-100 10C-76 2-56-20-44-60L44-60C56-20 76 2 100 10L88 20L-88 20Z" fill="${roof}"/>

  return `<section class="card ${o.cls||''}" id="${o.id||''}"><div class="cc">${svg(`<rect width="400" height="800" fill="${o.bg||'#d7141f'}"/>${c}${o.art||''}`)}</div><div class="ct"><div class="ep">${o.ep}</div><div class="kj">${o.kj}</div><h2>${o.title}</h2><p>${o.sub||''}</p></div></section>`}

/* ---- Interpolation ---- */
function val(k,P,r){if(k==null)return null;if(typeof k==='number')return k;
  if(Array.isArray(k[0])){if(P<=k[0][0])return k[0][1];for(let i=1;i<k.length;i++){if(P<=k[i][0]){const a=k[i-1],b=k[i],t=(P-a[0])/((b[0]-a[0])||1);return a[1]+(b[1]-a[1])*t}}return k[k.length-1][1]}
  const t=r?clamp((P-r[0])/((r[1]-r[0])||1)):P;return k[0]+(k[1]-k[0])*t}

/* ---- Interactions globales ---- */
const ST={resist:0,lx:.5,ly:.5,lant:false,lastPtr:-9};
function bindTap(btn){if(!btn)return;const hit=e=>{e.preventDefault();ST.resist=clamp(ST.resist+.2);vib(18);AU.thud()};btn.addEventListener('pointerdown',hit);btn.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')hit(e)})}
function ringAt(pin,x,y){const r=document.createElement('div');r.className='ringfx go';r.style.left=x+'px';r.style.top=y+'px';pin.appendChild(r);setTimeout(()=>r.remove(),1300)}

/* ---- Poussière de cendre ---- */
function ashInit(st,o){const c=st.pin.querySelector('canvas.ash');if(!c)return;const x=c.getContext('2d'),n=o.n||60,r=R(77);
  const ps=[...Array(n)].map(()=>({x:r(),y:r(),s:.4+r()*1.8,v:.02+r()*.06,d:(r()-.5)*.03,a:.25+r()*.6}));
  st.ash={c,x,ps,col:o.col||'239,232,218',dir:o.dir==null?1:o.dir,w:0,h:0}}
function ashDraw(st,dt,boost){const a=st.ash;if(!a)return;const pw=st.pin.clientWidth,ph=st.pin.clientHeight;if(a.w!==pw||a.h!==ph){a.c.width=pw;a.c.height=ph;a.w=pw;a.h=ph}
  const x=a.x;x.clearRect(0,0,pw,ph);for(const p of a.ps){p.y+=p.v*dt*a.dir*(1+boost);p.x+=p.d*dt;if(p.y>1.05)p.y=-.05;if(p.y<-.05)p.y=1.05;if(p.x<-.05)p.x=1.05;if(p.x>1.05)p.x=-.05;
    x.fillStyle=`rgba(${a.col},${p.a})`;x.beginPath();x.arc(p.x*pw,p.y*ph,p.s,0,6.283);x.fill()}}

/* ---- Boucle ---- */
let T=0,last=performance.now(),barEl,ready=false;
function boot(){
  $$('.stage').forEach(el=>{const cfg=CFG[el.dataset.id];if(!cfg)return;const pin=$('.pin',el);
    const st={el,pin,cfg,p:0,layers:$$('.layer',el).map((e,i)=>({e,k:cfg.layers[i],last:''})),beats:$$('.b',el).map(e=>({e,at:+e.dataset.at,un:+e.dataset.until,on:false})),
      cues:(cfg.cues||[]).map(c=>({...c,f:false})),q:s=>$(s,el),qa:s=>$$(s,el),vis:false,fresh:true};
    if(cfg.ash)ashInit(st,cfg.ash);if(cfg.init)cfg.init(st);bindTap($('.tap',el));STAGES.push(st)});
  barEl=$('.bar');
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');$$('.b',e.target).forEach((b,i)=>setTimeout(()=>b.classList.add('on'),250+i*650))}}),{threshold:.35});
  $$('.panel,.card').forEach(el=>io.observe(el));
  const iv=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.6});$$('.vl').forEach(el=>iv.observe(el));
  const snd=$('#snd');snd.addEventListener('click',()=>{if(AU.on){AU.disable();snd.textContent='SON ✕'}else{AU.enable();snd.textContent='SON ♪'}});
  const en=$('.enter');if(en)en.addEventListener('click',()=>{if(!AU.on){AU.enable();snd.textContent='SON ♪'}en.style.display='none'});
  const m=$('.menu'),mb=$('#mbtn');mb.addEventListener('click',()=>m.classList.toggle('open'));$$('.menu a').forEach(a=>a.addEventListener('click',()=>m.classList.remove('open')));
  addEventListener('pointermove',e=>{ST.lx=e.clientX;ST.ly=e.clientY;ST.lastPtr=T;ST.lant=true},{passive:true});
  addEventListener('touchmove',e=>{const t=e.touches[0];if(t){ST.lx=t.clientX;ST.ly=t.clientY;ST.lastPtr=T;ST.lant=true}},{passive:true});
  ready=true;requestAnimationFrame(loop)}

function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  const vh=innerHeight,doc=document.documentElement,sh=doc.scrollHeight-vh;if(barEl)barEl.style.transform=`scaleX(${sh>0?clamp(scrollY/sh):0})`;
  ST.resist=clamp(ST.resist-dt*.28);
  for(const st of STAGES){const r=st.el.getBoundingClientRect(),v=r.bottom>-vh*.3&&r.top<vh*1.3;st.vis=v;if(!v)continue;
    const total=Math.max(1,r.height-vh),P=clamp(-r.top/total);st.p=P;
    for(const l of st.layers){const k=l.k;if(!k||!k.k)continue;const q=k.k,rg=k.range;
      const x=val(q.x,P,rg),y=val(q.y,P,rg),s=val(q.s,P,rg),rot=val(q.r,P,rg),o=val(q.o,P,rg);
      const tf=`translate3d(${x==null?0:x}%,${y==null?0:y}%,0) scale(${s==null?1:s}) rotate(${rot==null?0:rot}deg)`,key=tf+'|'+o;
      if(key!==l.last){l.last=key;l.e.style.transform=tf;if(o!=null)l.e.style.opacity=o}}
    for(const b of st.beats){const on=P>=b.at&&P<b.un;if(on!==b.on){b.on=on;b.e.classList.toggle('on',on)}}
    for(const c of st.cues){if(P>=c.at&&P<c.at+.25&&!c.f){c.f=true;if(!st.fresh||P<c.at+.08)c.fn(st)}else if(P<c.at-.03)c.f=false}
    st.fresh=false;
    ashDraw(st,dt,st.cfg.ashBoost?st.cfg.ashBoost(P):0);
    if(st.cfg.fx)st.cfg.fx(st,P,T,dt)}
  requestAnimationFrame(loop)}
